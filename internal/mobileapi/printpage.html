<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print a bag label</title>
<style>
  body{font:15px/1.4 system-ui,sans-serif;margin:0;padding:16px;background:#f6f5f1;color:#1d1c18;max-width:480px;margin-inline:auto}
  h1{font-size:1.2rem;margin:0 0 4px}
  .sub{color:#6b6757;font-size:.85rem;margin:0 0 20px}
  section{background:#fff;border:1px solid #ddd9cc;border-radius:10px;padding:14px;margin-bottom:14px}
  section[hidden]{display:none}
  h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#6b6757;margin:0 0 10px}
  label{display:block;font-size:.8rem;color:#6b6757;margin:10px 0 3px}
  input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:1rem}
  button{width:100%;padding:11px;border:none;border-radius:8px;background:#0d7d6e;color:#fff;font-size:1rem;font-weight:600;margin-top:12px;cursor:pointer}
  button:disabled{background:#aaa;cursor:not-allowed}
  button.secondary{background:#eeece4;color:#1d1c18}
  .ok{color:#0d7d6e}
  .err{color:#a3281f;font-weight:600}
  .warn{background:#fbeedb;color:#a35a00;border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:14px}
  #log{font-family:ui-monospace,monospace;font-size:.78rem;white-space:pre-wrap;color:#6b6757;margin-top:10px;max-height:160px;overflow-y:auto}
  .status-line{font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<h1>Print a bag label</h1>
<p class="sub">Bluetooth, straight from this device — works for a Labelnize/Phomemo PM260 (or compatible M-series) printer in range of whatever phone or laptop has this page open. Chrome or Edge only; Safari/iOS has no Web Bluetooth.</p>

<div id="compat-warning" class="warn" hidden></div>

<section id="login-section">
  <h2>1. Sign in</h2>
  <div id="login-fields">
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn">Sign in</button>
  </div>
  <div id="twofa-fields" hidden>
    <label for="code">2FA code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code">
    <button id="twofa-btn">Verify</button>
  </div>
  <div id="login-status" class="status-line"></div>
</section>

<section id="printer-section" hidden>
  <h2>2. Printer</h2>
  <div id="printer-status" class="status-line">Not connected.</div>
  <button id="connect-btn">Connect to printer</button>
</section>

<section id="label-section" hidden>
  <h2>3. Label</h2>
  <label for="set">Set number</label>
  <input id="set" placeholder="75192" inputmode="numeric">
  <label for="bag-kind">Bag</label>
  <select id="bag-kind"><option value="">Look up this set's bags first…</option></select>
  <label for="size">Size</label>
  <select id="size">
    <option value="50x30" selected>50 x 30 mm</option>
    <option value="40x30">40 x 30 mm</option>
  </select>
  <button id="print-btn">Print</button>
  <div id="print-status" class="status-line"></div>
  <div id="log"></div>
</section>

<script>
(function () {
  'use strict';

  // -- The PM260's (and compatible M-series Phomemo/Labelnize printers')
  // Bluetooth LE protocol: service 0xff00, write characteristic 0xff02,
  // ESC/POS-style init + heat/density + raster header, 128-byte chunks.
  // Confirmed against the "myphomemo" open-source project's own M260 path.
  var BLE_SERVICE = 0xff00;
  var BLE_WRITE_CHAR = 0xff02;
  var CHUNK_SIZE = 128;
  var CHUNK_DELAY_MS = 20;
  var DENSITY = 6; // 1-8, matches the CLI/TUI default
  var FEED_DOTS = 32;
  var HEAT_TIMES = [40, 60, 80, 100, 120, 140, 160, 200];

  var token = sessionStorage.getItem('wms_print_token') || '';
  var pendingLoginToken = '';
  var printerChar = null;
  var printerDevice = null;

  function $(id) { return document.getElementById(id); }
  function log(msg) { var el = $('log'); el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function checkCompat() {
    var warn = $('compat-warning');
    var problems = [];
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      problems.push('This page needs HTTPS (Web Bluetooth refuses to run over plain HTTP, except on localhost).');
    }
    if (!navigator.bluetooth) {
      problems.push('Web Bluetooth isn’t available in this browser. Use Chrome or Edge on Android or desktop — not Safari/iOS, which has no Web Bluetooth support at all.');
    }
    if (problems.length) {
      warn.hidden = false;
      warn.textContent = problems.join(' ');
    }
    return problems.length === 0;
  }

  function showLoggedIn() {
    $('login-fields').hidden = true;
    $('twofa-fields').hidden = true;
    $('login-status').innerHTML = '<span class="ok">Signed in.</span>';
    $('printer-section').hidden = false;
    $('label-section').hidden = false;
  }

  async function doLogin() {
    $('login-status').textContent = 'Signing in…';
    try {
      var res = await fetch('/mobile/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ Username: $('username').value, Password: $('password').value }),
      });
      var body = await res.json();
      if (!res.ok) { $('login-status').innerHTML = '<span class="err">' + (body.error || 'sign-in failed') + '</span>'; return; }
      if (body.needs_2fa) {
        pendingLoginToken = body.token;
        $('twofa-fields').hidden = false;
        $('login-status').textContent = 'Enter your 2FA code.';
        return;
      }
      token = body.token;
      sessionStorage.setItem('wms_print_token', token);
      showLoggedIn();
    } catch (e) {
      $('login-status').innerHTML = '<span class="err">' + e.message + '</span>';
    }
  }

  async function doTwoFA() {
    $('login-status').textContent = 'Verifying…';
    try {
      var res = await fetch('/mobile/login/2fa', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ Token: pendingLoginToken, Code: $('code').value }),
      });
      var body = await res.json();
      if (!res.ok) { $('login-status').innerHTML = '<span class="err">' + (body.error || 'wrong code') + '</span>'; return; }
      token = body.token;
      sessionStorage.setItem('wms_print_token', token);
      showLoggedIn();
    } catch (e) {
      $('login-status').innerHTML = '<span class="err">' + e.message + '</span>';
    }
  }

  async function connectPrinter() {
    $('printer-status').textContent = 'Choose your printer…';
    try {
      printerDevice = await navigator.bluetooth.requestDevice({
        filters: [
          { namePrefix: 'M260' }, { namePrefix: 'PM260' }, { namePrefix: 'PM-260' },
          { namePrefix: 'Labelnize' }, { namePrefix: 'Phomemo' }, { namePrefix: 'Etikez' },
        ],
        optionalServices: [BLE_SERVICE],
      });
      printerDevice.addEventListener('gattserverdisconnected', function () {
        printerChar = null;
        $('printer-status').innerHTML = 'Disconnected.';
      });
      $('printer-status').textContent = 'Connecting to ' + printerDevice.name + '…';
      var server = await printerDevice.gatt.connect();
      var service = await server.getPrimaryService(BLE_SERVICE);
      printerChar = await service.getCharacteristic(BLE_WRITE_CHAR);
      $('printer-status').innerHTML = '<span class="ok">Connected to ' + printerDevice.name + '.</span>';
    } catch (e) {
      $('printer-status').innerHTML = '<span class="err">' + e.message + '</span>';
    }
  }

  async function writeChunk(bytes) {
    if (printerChar.writeValueWithoutResponse) {
      await printerChar.writeValueWithoutResponse(bytes);
    } else {
      await printerChar.writeValue(bytes);
    }
  }

  async function sendRaster(widthBytes, heightLines, data) {
    var heatTime = HEAT_TIMES[Math.max(0, Math.min(7, DENSITY - 1))];
    log('init…');
    await writeChunk(new Uint8Array([0x1b, 0x40]));
    await sleep(100);
    log('density/heat…');
    await writeChunk(new Uint8Array([0x1b, 0x37, 7, heatTime, 2]));
    await sleep(30);
    await writeChunk(new Uint8Array([0x1d, 0x7c, DENSITY]));
    await sleep(50);
    log('header (' + widthBytes + ' bytes x ' + heightLines + ' lines)…');
    await writeChunk(new Uint8Array([
      0x1d, 0x76, 0x30, 0x00,
      widthBytes & 0xff, 0x00,
      heightLines & 0xff, (heightLines >> 8) & 0xff,
    ]));
    log('sending image…');
    for (var i = 0; i < data.length; i += CHUNK_SIZE) {
      var chunk = data.slice(i, Math.min(i + CHUNK_SIZE, data.length));
      await writeChunk(chunk);
      await sleep(CHUNK_DELAY_MS);
      $('print-status').textContent = 'Sending… ' + Math.round(Math.min(i + chunk.length, data.length) / data.length * 100) + '%';
    }
    await sleep(300);
    log('feed…');
    await writeChunk(new Uint8Array([0x1b, 0x4a, FEED_DOTS]));
    await sleep(800);
    log('done.');
  }

  function base64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function loadBags() {
    var set = $('set').value.trim();
    var select = $('bag-kind');
    select.innerHTML = '<option value="">Looking up…</option>';
    if (!set) { select.innerHTML = '<option value="">Type a set number first</option>'; return; }
    try {
      var res = await fetch('/mobile/print/bags?set=' + encodeURIComponent(set), { headers: { Authorization: 'Bearer ' + token } });
      var bags = await res.json();
      if (!res.ok) { select.innerHTML = '<option value="">' + ((bags && bags.error) || 'could not look up bags') + '</option>'; return; }
      if (!bags || !bags.length) { select.innerHTML = '<option value="">No bags for this set yet</option>'; return; }
      select.innerHTML = '';
      bags.forEach(function (b) {
        var opt = document.createElement('option');
        opt.value = b.Code; // the bag's own true code -- unique per instance, unlike its kind
        opt.dataset.kind = b.Key;
        opt.textContent = b.Name + ' (' + b.Code + ')';
        select.appendChild(opt);
      });
    } catch (e) {
      select.innerHTML = '<option value="">' + e.message + '</option>';
    }
  }

  async function printLabel() {
    if (!printerChar) { $('print-status').innerHTML = '<span class="err">Connect to the printer first.</span>'; return; }
    var set = $('set').value.trim();
    if (!set) { $('print-status').innerHTML = '<span class="err">Set number required.</span>'; return; }
    var bagOpt = $('bag-kind').selectedOptions[0];
    var bagCode = bagOpt && bagOpt.value;
    if (!bagCode) { $('print-status').innerHTML = '<span class="err">Look up and choose a bag first.</span>'; return; }
    $('log').textContent = '';
    $('print-status').textContent = 'Fetching label…';
    try {
      var qs = new URLSearchParams({ set: set, bag_code: bagCode, bag_kind: bagOpt.dataset.kind || '', size: $('size').value });
      var res = await fetch('/mobile/print/raster?' + qs.toString(), { headers: { Authorization: 'Bearer ' + token } });
      var body = await res.json();
      if (!res.ok) { $('print-status').innerHTML = '<span class="err">' + (body.error || 'could not build the label') + '</span>'; return; }
      await sendRaster(body.width_bytes, body.height_lines, base64ToBytes(body.data));
      $('print-status').innerHTML = '<span class="ok">Printed.</span>';
    } catch (e) {
      $('print-status').innerHTML = '<span class="err">' + e.message + '</span>';
    }
  }

  $('login-btn').addEventListener('click', doLogin);
  $('twofa-btn').addEventListener('click', doTwoFA);
  $('connect-btn').addEventListener('click', connectPrinter);
  $('print-btn').addEventListener('click', printLabel);
  $('set').addEventListener('blur', function () { if (token) loadBags(); });

  if (checkCompat() && token) {
    showLoggedIn();
  }
})();
</script>
</body>
</html>

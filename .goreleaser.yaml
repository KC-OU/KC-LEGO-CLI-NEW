# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: wms-go

# Real troff man pages (`man wms`, `man wms-lego-check`, ...) generated from
# the live command tree via cobra/doc.GenManTree (cmd/wms/mangen.go) -- same
# idea as docs-gen's Markdown reference, just a different renderer, so they
# can never drift from --help. Picked up below by both archives.files (so a
# manual tar.gz install can `man` them locally) and nfpms.contents (so a
# .deb/.rpm/.apk install puts them straight into /usr/share/man/man1 --
# nothing further for a package-manager install to do). Generated outside
# dist/: goreleaser's own dist-must-be-empty check runs after before.hooks,
# so writing into dist/man here (as a first real `goreleaser release` run
# found) fails that check even with --clean.
before:
  hooks:
    - sh -c 'go run ./cmd/wms man-gen man-gen'

builds:
  - id: wms
    main: ./cmd/wms
    binary: wms
    env: [CGO_ENABLED=0]
    # The gateway and plugin sandbox use Unix APIs (flock, process groups), so Windows is not a target.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - id: wms
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.env
      - src: deploy/systemd/*.service
        dst: systemd
        strip_parent: true
      - src: man-gen/*.1
        dst: man
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: wms-go
    vendor: KC-OU
    homepage: https://github.com/KC-OU/KC-LEGO-CLI-NEW
    maintainer: Kieran Collins <noreply@users.noreply.github.com>
    description: LEGO collection CLI/TUI with ModernWMS and Part-DB tools (telnet + web terminal gateway)
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: deploy/systemd/wms-gateway.service
        dst: /lib/systemd/system/wms-gateway.service
      - src: deploy/systemd/wms-sync.service
        dst: /lib/systemd/system/wms-sync.service
      - src: config.example.env
        dst: /etc/wms-go/wms-go.env.example
        type: config|noreplace
      - src: man-gen/*.1
        dst: /usr/share/man/man1/

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: KC-OU
    name: KC-LEGO-CLI-NEW
  draft: false
  prerelease: auto
